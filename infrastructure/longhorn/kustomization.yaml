---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: do not set a top-level `namespace:` — it mutates `metadata.namespace`
# on every resource BEFORE sops decryption, which corrupts the encrypted MAC
# on backup-secret.sops.yaml and breaks decryption. Each resource sets its
# own namespace explicitly.
resources:
  - namespace.yaml
  - helmrelease.yaml
  - backup-secret.sops.yaml
  - recurringjob.yaml
  # - storageclass.yaml  # StorageClass params are immutable; replica count set via defaultSettings.defaultReplicaCount in HelmRelease
